episode_process:
  episodes_per_subject: 1
  retained_episode_policy: ONE_CANONICAL_SYNTHETIC_CRITICAL_CARE_EPISODE_PER_SUBJECT
  explicit_boundaries_required: [intime, outtime]
  infer_boundaries_from_measurements: false
  duration_model:
    algorithm: TRUNCATED_LOGNORMAL_LATENT_BURDEN_MODEL
    equation: "log(duration_hours) = duration_intercept + duration_latent_coefficients dot z_0 + duration_support_propensity_coefficient * support_propensity + duration_noise"
    noise_distribution: "Normal(0, duration_noise_scale)"
    minimum_hours: null
    maximum_hours: null
    duration_intercept: null
    duration_latent_coefficients: null
    duration_support_propensity_coefficient: null
    duration_noise_scale: null
    parameter_status: REVIEW_REQUIRED_SYNTHETIC_DESIGN_PARAMETERS
    variability_required: true
    fixed_duration_prohibited: true
    single_visible_feature_determinism_prohibited: true
    structural_coverage_goal:
      - episodes_with_no_legal_cutoff
      - episodes_with_one_legal_cutoff
      - episodes_with_multiple_legal_cutoffs
      - recovery24_available_but_recovery48_unavailable
      - support_horizon_censored
      - long_episode_reaching_later_grid_positions
    prevalence_quota: null
  outtime_rule: intime_plus_generated_duration
  outtime_model_eligible: false

calendar_policy:
  timezone: UTC
  timestamp_representation: ISO_8601_UTC_Z_WITH_MICROSECOND_CAPABILITY
  deterministic_epoch: "2100-01-01T00:00:00Z"
  intime_derivation: DETERMINISTIC_SUBJECT_STREAM_OFFSET_FROM_SYNTHETIC_EPOCH
  calendar_effects_modeled: false
  calendar_year_model_eligible: false
  calendar_year_split_allowed: false
  fake_mimic_anchor_year_groups_allowed: false
  daylight_saving_time_handling: NOT_APPLICABLE_UTC_ONLY

latent_state_process:
  exported: false
  persistence_default: DO_NOT_PERSIST_PER_PATIENT_LATENT_TRAJECTORIES
  state_names:
    - systemic_severity
    - cardiac_stress
    - respiratory_burden
    - renal_burden
    - neurologic_burden
  outcome_class_or_trajectory_class_present: false
  internal_step_hours: 1
  update_algorithm: COUPLED_MEAN_REVERTING_STOCHASTIC_STATE_WITH_SPARSE_SHOCKS
  equation: "z_(n+1) = z_n + K*(mu_i-z_n)*dt + d_i*dt + C*tanh(z_n)*dt + shock_(i,n) + L*epsilon_(i,n)*sqrt(dt) + documented_intervention_effect_(i,n)"
  parameter_definitions:
    z_n: continuous five-dimensional hidden state at internal step n
    mu_i: patient-specific equilibrium from population mixture and continuous random effects
    K: diagonal or reviewed stable mean-reversion matrix
    d_i: continuous patient-specific drift vector
    C: cross-domain coupling matrix with bounded spectral behavior
    shock_i_n: sparse signed pulse with stochastic onset, duration, magnitude, and affected domains
    L: noise-loading matrix supporting shared and domain-specific innovations
    epsilon_i_n: independent standard-normal innovation from the subject latent substream
  required_config_parameters:
    - population_latent_mean_and_covariance_by_reviewed_condition_group
    - patient_random_effect_covariance
    - mean_reversion_matrix
    - drift_distribution
    - coupling_matrix
    - shock_hazard_duration_and_magnitude_distributions
    - innovation_loading_matrix
  parameter_values_status: REVIEW_REQUIRED_BEFORE_PHASE_3_FINAL_IMPLEMENTATION
  design_constraints:
    - continuous_between_patient_heterogeneity
    - continuous_within_patient_variation
    - temporal_persistence_without_perfect_linearity
    - improving_worsening_fluctuating_and_stable_behaviors_emerge_without_labels
    - shared_factors_plus_variable_specific_noise
    - no_deterministic_three_template_process
    - history_informative_but_not_deterministic

true_physiology_process:
  equation: "x_v(t) = inverse_link_v(baseline_v + patient_effect_v + loading_v dot z(t) + periodic_term_v(t) + process_error_v(t))"
  categorical_equation: "category_v(t) is sampled from softmax(category_intercepts_v + category_loadings_v dot z(t))"
  process_error:
    temporally_correlated: true
    model: VARIABLE_SPECIFIC_AR1_AROUND_LATENT_DRIVEN_MEAN
  cross_variable_dependence:
    shared_latent_loadings_required: true
    independent_generation_of_all_variables_prohibited: true
    all_variables_deterministic_from_one_scalar_prohibited: true
  parameter_values_status: REVIEW_REQUIRED_SYNTHETIC_DESIGN_PARAMETERS

