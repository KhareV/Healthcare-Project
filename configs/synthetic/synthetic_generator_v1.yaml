rng_policy:
  version: synthetic_rng_policy_v1
  primary_seed_field: primary_seed
  primary_seed: null
  primary_seed_status: UNLOCKED_FINAL_GENERATOR_PARAMETER
  engine: numpy.random.Generator
  bit_generator: PCG64
  global_rng_mutation_allowed: false
  deterministic_substreams:
    derivation: numpy.random.SeedSequence([primary_seed, subject_ordinal, component_code])
    component_codes:
      identity_and_statics: 1
      episode_duration_and_calendar: 2
      latent_state: 3
      physiological_noise: 4
      observation_process: 5
      measurement_noise: 6
      support_process: 7
    spawn_order_dependency_allowed: false
  reproducibility_identity:
    bind_code_identity: true
    bind_config_sha256: true
    bind_schema_sha256: true
    bind_python_version: true
    bind_numpy_version: true
    identical_inputs_expectation: BYTE_EQUIVALENT_AFTER_CANONICAL_SERIALIZATION

