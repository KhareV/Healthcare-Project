domain_interpretation:
  bounds_status: SYNTHETIC_GENERATOR_SAFETY_DOMAINS_NOT_CLINICAL_REFERENCE_RANGES
  sofa_thresholds_in_generator: false
  canonical_feature_order_frozen_here: false
  phase_5_selects_model_features: true
  impossible_value_policy: HARD_FAILURE_BEFORE_EXPORT
  clipping_policy: DOCUMENTED_TRUNCATED_SAMPLING_OR_LINK_TRANSFORM_NOT_SILENT_POST_HOC_REPAIR

observation_process:
  model: VARIABLE_SPECIFIC_SEVERITY_MODULATED_RENEWAL_PROCESS
  equation: "lambda_v(t) = base_rate_v * exp(observation_loading_v dot z(t) + patient_observation_effect_v), bounded by configured min/max rates"
  event_time_generation: EXPONENTIAL_WAITING_TIME_FROM_LOCAL_OBSERVATION_SUBSTREAM
  variable_specific_rates_required: true
  temporally_varying_density_allowed: true
  severity_informative_observation_density_allowed: true
  severity_effect_must_be_documented: true
  perfectly_regular_authoritative_grid_prohibited: true
  base_rates_and_loadings: null
  parameter_status: REVIEW_REQUIRED_SYNTHETIC_DESIGN_PARAMETERS
  missingness_representation: ABSENCE_OF_EVENT_ROW
  observed_null_rows_allowed: false
  duplicates_in_final_authoritative_data: false
  duplicate_hostile_cases_location: ENGINEERING_FIXTURES_ONLY

measurement_noise:
  conceptual_separation: TRUE_PHYSIOLOGY_DISTINCT_FROM_OBSERVED_VALUE
  equation: "observed_v = bounded_inverse_link_v(link_v(true_v) + bias_subject_v + measurement_error_v)"
  error_distribution: VARIABLE_SPECIFIC_ZERO_MEAN_DISTRIBUTION_FROM_MEASUREMENT_SUBSTREAM
  subject_bias_distribution: null
  variable_noise_scales: null
  parameter_status: REVIEW_REQUIRED_SYNTHETIC_DESIGN_PARAMETERS
  finite_values_required: true
  invalid_value_policy: HARD_FAILURE
  silent_clipping_allowed: false

support_process:
  output: RAW_CLOSED_OPEN_INTERVALS_NOT_LABELS
  interval_convention: CLOSED_OPEN
  transition_model: STOCHASTIC_MARKOV_HAZARD_CONDITIONED_ON_CURRENT_AND_RECENT_LATENT_STATE
  off_to_on_equation: "P(OFF_TO_ON during step) = sigmoid(alpha_start + beta_current dot z(t) + beta_recent dot recent_state_summary + random_effect + innovation)"
  on_to_off_equation: "P(ON_TO_OFF during step) = sigmoid(alpha_stop + gamma_current dot z(t) + duration_effect + innovation)"
  deterministic_single_threshold_copy_prohibited: true
  independent_coin_flip_prohibited: true
  spans_multiple_prediction_cutoffs_supported: true
  episode_end_truncates_active_interval: true
  intervention_effects:
    enabled_in_concept: true
    mechanism: BOUNDED_DELAYED_SHIFT_TO_RELEVANT_LATENT_DRIFT_WHILE_SUPPORT_ACTIVE
    instantaneous_severity_reset_prohibited: true
    causal_claim_allowed: false
    parameters: null
    status: REVIEW_REQUIRED_SYNTHETIC_DESIGN_PARAMETERS
  vasopressor:
    required_fields: [agent_key, interval_start, interval_end, rate_value, rate_unit]
    vocabulary: null
    vocabulary_status: REVIEW_REQUIRED_SYNTHETIC_SUPPORT_VOCABULARY
    qualifying_vs_nonqualifying_explicit: true
    pulkit_adapter_target: NormalizedActiveInterval
    compatible_test_profile_keys: [QUALIFYING_AGENT_A, QUALIFYING_AGENT_B]
    rate_segments_required_when_rate_changes: true
  ventilation:
    required_fields: [respiratory_category, interval_start, interval_end]
    internal_categories: [INVASIVE, NON_INVASIVE, HFNC, ORDINARY_OXYGEN]
    endpoint_qualifying_categories: [INVASIVE]
    explicitly_nonqualifying_categories: [NON_INVASIVE, HFNC, ORDINARY_OXYGEN]
    unknown_category_policy: HARD_FAILURE
    pulkit_adapter_target: NormalizedVentilationInterval
  parameters:
    start_hazard_coefficients: null
    stop_hazard_coefficients: null
    random_effect_distributions: null
    rate_distributions: null
    status: REVIEW_REQUIRED_SYNTHETIC_DESIGN_PARAMETERS

